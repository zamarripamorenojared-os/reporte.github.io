<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitácora de Préstamo – FIM UAS</title>

<style>
body{
  font-family: Arial, sans-serif;
  margin:0;
  background:#f4f4f4;
}

header{
  background:#003366;
  color:white;
  padding:15px;
}

h1{
  margin:0;
  font-size:20px;
}

.layout{
  display:grid;
  grid-template-columns:320px 1fr;
  min-height:100vh;
}

.sidebar{
  background:white;
  padding:15px;
  border-right:1px solid #ccc;
}

.main{
  padding:15px;
  background:white;
}

.field{
  margin-bottom:10px;
}

.field label{
  font-size:12px;
  display:block;
  margin-bottom:3px;
}

.field input,
.field select,
.field textarea{
  width:100%;
  padding:6px;
  border:1px solid #ccc;
}

button{
  padding:8px 12px;
  background:#003366;
  color:white;
  border:none;
  cursor:pointer;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

th, td{
  border:1px solid #ccc;
  padding:6px;
  font-size:13px;
}

th{
  background:#e9e9e9;
}
</style>
</head>

<body>

<header>
<h1>Bitácora de Préstamo de Equipos - FIM UAS</h1>
</header>

<div class="layout">

<div class="sidebar">
<h3>Nuevo Préstamo</h3>

<div class="field">
<label>Nombre</label>
<input type="text" id="nombre">
</div>

<div class="field">
<label>Equipo</label>
<input type="text" id="equipo">
</div>

<div class="field">
<label>No. Serie</label>
<input type="text" id="serie">
</div>

<div class="field">
<label>Fecha</label>
<input type="date" id="fecha">
</div>

<button onclick="registrar()">Registrar</button>

</div>

<div class="main">
<h3>Registros</h3>

<table>
<thead>
<tr>
<th>#</th>
<th>Nombre</th>
<th>Equipo</th>
<th>Serie</th>
<th>Fecha</th>
<th>Acción</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>

</div>
</div>

<script>

let prestamos = JSON.parse(localStorage.getItem("prestamos") || "[]");

function guardar(){
  localStorage.setItem("prestamos", JSON.stringify(prestamos));
}

function registrar(){
  const nombre = document.getElementById("nombre").value;
  const equipo = document.getElementById("equipo").value;

  if(!nombre || !equipo){
    alert("Nombre y equipo obligatorios");
    return;
  }

  const p = {
    id: Date.now(),
    nombre,
    equipo,
    serie: document.getElementById("serie").value,
    fecha: document.getElementById("fecha").value
  };

  prestamos.push(p);
  guardar();
  render();
  limpiar();
}

function eliminar(id){
  prestamos = prestamos.filter(p => p.id !== id);
  guardar();
  render();
}

function render(){
  const tabla = document.getElementById("tabla");
  tabla.innerHTML = "";

  prestamos.forEach((p,i)=>{
    tabla.innerHTML += `
      <tr>
        <td>${i+1}</td>
        <td>${p.nombre}</td>
        <td>${p.equipo}</td>
        <td>${p.serie || "-"}</td>
        <td>${p.fecha || "-"}</td>
        <td><button onclick="eliminar(${p.id})">Eliminar</button></td>
      </tr>
    `;
  });
}

function limpiar(){
  document.getElementById("nombre").value="";
  document.getElementById("equipo").value="";
  document.getElementById("serie").value="";
  document.getElementById("fecha").value="";
}

render();

</script>

</body>
</html>
