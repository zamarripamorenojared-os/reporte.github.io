<style>
body{
  font-family: Arial, sans-serif;
  margin:0;
  background:#f5f5f5;
  color:#222;
}

/* HEADER */
header{
  background:#003366;
  color:white;
  padding:15px;
}
header h1{
  margin:0;
  font-size:20px;
}

/* LAYOUT */
.layout{
  display:grid;
  grid-template-columns:320px 1fr;
  min-height:100vh;
}

/* SIDEBAR */
.sidebar{
  background:white;
  border-right:1px solid #ccc;
  display:flex;
  flex-direction:column;
}
.sidebar-header,
.sidebar-body,
.sidebar-footer{
  padding:15px;
}

.sidebar-header{
  border-bottom:1px solid #ccc;
}

.sidebar-footer{
  border-top:1px solid #ccc;
}

/* FORM */
.field{
  margin-bottom:10px;
}
.field label{
  font-size:12px;
  display:block;
  margin-bottom:3px;
}
.field input,
.field select,
.field textarea{
  width:100%;
  padding:6px;
  border:1px solid #ccc;
  font-size:13px;
}

.form-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.form-row-3{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
}

.radio-group{
  display:flex;
  gap:10px;
}

/* BUTTONS */
.btn{
  padding:8px 12px;
  border:none;
  cursor:pointer;
  font-size:13px;
}
.btn-primary{ background:#003366; color:white; }
.btn-success{ background:#2e8b57; color:white; }
.btn-danger{ background:#b22222; color:white; }
.btn-ghost{ background:#ddd; }

/* MAIN */
.main{
  padding:15px;
  background:white;
  display:flex;
  flex-direction:column;
}

.main-toolbar{
  margin-bottom:10px;
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}

.search-box input{
  padding:6px;
  border:1px solid #ccc;
}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

th, td{
  border:1px solid #ccc;
  padding:6px;
  text-align:left;
}

th{
  background:#e9e9e9;
}

/* BADGES */
.badge{
  padding:3px 6px;
  font-size:12px;
  border-radius:4px;
}
.badge-prestamo{ background:#d0e3ff; }
.badge-entregado{ background:#c8f7c5; }
.badge-vencido{ background:#f7c5c5; }

/* MODAL */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
}
.modal-overlay.open{
  display:flex;
}
.modal{
  background:white;
  padding:20px;
  width:400px;
  border:1px solid #ccc;
}

/* RESPONSIVE */
@media(max-width:900px){
  .layout{
    grid-template-columns:1fr;
  }
}
</style>
